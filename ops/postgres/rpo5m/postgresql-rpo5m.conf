# PostgreSQL settings for Point-in-Time Recovery with target RPO <= 5 minutes.
# Include this from postgresql.conf on your production DB server:
# include_if_exists = '/etc/postgresql/rpo5m/postgresql-rpo5m.conf'

wal_level = replica
archive_mode = on

# Force a WAL segment switch at least every 5 minutes so archived WAL
# is never older than ~5 minutes, even on low-write systems.
archive_timeout = 300

# archive_command can be overridden directly in postgresql.conf if needed.
archive_command = 'bash /opt/gog/ops/postgres/rpo5m/archive_wal.sh %p %f'

# Recommended for replicas/failover readiness.
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
